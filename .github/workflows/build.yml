name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui check
      - run: pnpm --dir ui build
      - run: cargo clippy -p supstream-core -p supstream-headless --all-targets -- -D warnings
      - run: cargo test -p supstream-core

  # Установщик Windows (.exe). Client ID Twitch-приложения берётся из секрета
  # репозитория SUPSTREAM_TWITCH_CLIENT_ID и вшивается в сборку.
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm tauri build
        env:
          SUPSTREAM_TWITCH_CLIENT_ID: ${{ secrets.SUPSTREAM_TWITCH_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: supstream-windows-setup
          path: target/release/bundle/nsis/*.exe
