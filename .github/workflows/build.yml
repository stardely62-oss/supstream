name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Действия на Node 24; pnpm берётся через corepack по полю packageManager в package.json.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui check
      - run: pnpm --dir ui build
      - run: cargo clippy -p supstream-core -p supstream-headless --all-targets -- -D warnings
      - run: cargo test -p supstream-core

  # Установщик Windows (.exe). Client ID Twitch-приложения берётся из секрета
  # репозитория SUPSTREAM_TWITCH_CLIENT_ID и вшивается в сборку.
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm tauri build
        env:
          SUPSTREAM_TWITCH_CLIENT_ID: ${{ secrets.SUPSTREAM_TWITCH_CLIENT_ID }}
      - uses: actions/upload-artifact@v5
        with:
          name: supstream-windows-setup
          path: target/release/bundle/nsis/*.exe
