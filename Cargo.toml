[workspace]
resolver = "3"
members = ["crates/core", "crates/headless", "src-tauri"]
# Десктоп-оболочка (src-tauri) требует WebView2/webkit, поэтому по умолчанию
# собираются только ядро и консольный запуск.
default-members = ["crates/core", "crates/headless"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
supstream-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
